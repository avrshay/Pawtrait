    <path d="M 140,290 L 142,295 L 147,297 L 142,299 L 140,304 L 138,299 L 133,297 L 138,295 Z" fill="#E29578" opacity="0.7" />
  </g>
  <text x="250" y="420" font-family="'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="#332211" text-anchor="middle" letter-spacing="1">Pawtrait</text>
  <text x="250" y="450" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#7A6F5D" text-anchor="middle" letter-spacing="3.5">AI PET ARTWORK</text>
