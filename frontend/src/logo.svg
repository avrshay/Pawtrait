    <ellipse cx="215" cy="170" rx="17" ry="24" transform="rotate(-5, 215, 170)" fill="url(#pawGrad)" />
    <ellipse cx="285" cy="170" rx="17" ry="24" transform="rotate(5, 285, 170)" fill="url(#pawGrad)" />
    <ellipse cx="325" cy="195" rx="16" ry="22" transform="rotate(20, 325, 195)" fill="url(#pawGrad)" />
    <g transform="rotate(-15, 360, 310)">
      <path d="M 345,390 L 355,300 C 355,295 365,295 365,300 L 375,390 C 373,400 347,400 345,390 Z" fill="#D4A373" />
