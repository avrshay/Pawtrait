    <rect x="148" y="128" width="204" height="204" rx="38" fill="#FFFFFF" filter="url(#softShadow)" />
    <path d="M 210,275 C 185,275 175,245 195,225 C 215,205 235,205 250,220 C 265,205 285,205 305,225 C 325,245 315,275 290,275 Z" fill="url(#pawGrad)" />
